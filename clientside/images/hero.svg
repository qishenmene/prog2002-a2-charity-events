<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>
  <!-- sky -->
  <rect width="1600" height="560" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="1180" cy="210" r="90" fill="url(#sun)" opacity="0.9"/>
  <!-- ocean -->
  <rect y="560" width="1600" height="160" fill="url(#ocean)"/>
  <!-- waves -->
  <path d="M0 590 Q200 570 400 590 T800 590 T1200 590 T1600 590 V620 H0 Z" fill="#0EA5E9" opacity="0.4"/>
  <path d="M0 640 Q300 620 600 640 T1200 640 T1600 640 V680 H0 Z" fill="#38BDF8" opacity="0.3"/>
  <!-- sand -->
  <rect y="720" width="1600" height="180" fill="url(#sand)"/>
  <!-- hearts floating (charity theme) -->
  <g fill="#EF4444" opacity="0.7">
    <path d="M250 200 c-12,-20 -40,-14 -40,8 c0,22 40,42 40,42 c0,0 40,-20 40,-42 c0,-22 -28,-28 -40,-8 z" transform="scale(0.7) translate(80,40)"/>
    <path d="M450 150 c-8,-14 -28,-10 -28,6 c0,16 28,30 28,30 c0,0 28,-14 28,-30 c0,-16 -20,-20 -28,-6 z" transform="scale(0.6) translate(180,60)"/>
    <path d="M700 120 c-10,-16 -32,-12 -32,7 c0,19 32,35 32,35 c0,0 32,-16 32,-35 c0,-19 -22,-23 -32,-7 z" transform="scale(0.65) translate(280,30)"/>
  </g>
  <!-- people silhouettes -->
  <g fill="#1E293B" opacity="0.8">
    <!-- person 1 -->
    <circle cx="380" cy="730" r="22"/>
    <rect x="362" y="752" width="36" height="70" rx="8"/>
    <!-- person 2 (raised arm) -->
    <circle cx="460" cy="720" r="24"/>
    <rect x="440" y="744" width="40" height="80" rx="8"/>
    <rect x="478" y="680" width="12" height="70" rx="4" transform="rotate(15 484 715)"/>
    <!-- person 3 -->
    <circle cx="540" cy="735" r="20"/>
    <rect x="524" y="755" width="32" height="65" rx="8"/>
    <!-- person 4 (child) -->
    <circle cx="600" cy="755" r="16"/>
    <rect x="586" y="771" width="28" height="55" rx="8"/>
  </g>
  <!-- donation box -->
  <g transform="translate(680,700)">
    <rect x="0" y="20" width="70" height="55" rx="6" fill="#F59E0B"/>
    <rect x="0" y="20" width="70" height="55" rx="6" fill="none" stroke="#92400E" stroke-width="2"/>
    <rect x="28" y="5" width="14" height="20" fill="#92400E"/>
    <text x="35" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff" font-weight="bold">$</text>
  </g>
  <!-- banner flag -->
  <g transform="translate(840,580)">
    <rect x="2" y="0" width="4" height="140" fill="#475569"/>
    <path d="M6 0 L80 10 L6 40 Z" fill="#EF4444"/>
    <text x="20" y="26" font-family="Arial,sans-serif" font-size="14" fill="#fff" font-weight="bold">CHARITY</text>
  </g>
</svg>
