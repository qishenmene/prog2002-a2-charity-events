<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="340" cy="50" r="30" fill="#FDE68A" opacity="0.8"/>
  <!-- market stalls -->
  <!-- stall 1 -->
  <g transform="translate(30,80)">
    <path d="M0 60 L10 20 L90 20 L100 60 Z" fill="#fff" opacity="0.9"/>
    <path d="M5 60 L10 25 L90 25 L95 60" fill="#FEF3C7" opacity="0.8"/>
    <rect x="15" y="60" width="70" height="50" fill="#065F46" opacity="0.7"/>
    <!-- fruits -->
    <circle cx="30" cy="80" r="8" fill="#EF4444"/>
    <circle cx="50" cy="82" r="7" fill="#F59E0B"/>
    <circle cx="68" cy="80" r="8" fill="#DC2626"/>
  </g>
  <!-- stall 2 -->
  <g transform="translate(150,80)">
    <path d="M0 60 L10 20 L90 20 L100 60 Z" fill="#fff" opacity="0.9"/>
    <path d="M5 60 L10 25 L90 25 L95 60" fill="#D1FAE5" opacity="0.8"/>
    <rect x="15" y="60" width="70" height="50" fill="#065F46" opacity="0.7"/>
    <!-- crafts -->
    <rect x="25" y="75" width="15" height="15" fill="#FBBF24" opacity="0.8"/>
    <rect x="50" y="75" width="15" height="15" fill="#F472B6" opacity="0.8"/>
    <rect x="25" y="95" width="15" height="15" fill="#3B82F6" opacity="0.8"/>
    <rect x="50" y="95" width="15" height="15" fill="#F59E0B" opacity="0.8"/>
  </g>
  <!-- stall 3 -->
  <g transform="translate(270,80)">
    <path d="M0 60 L10 20 L90 20 L100 60 Z" fill="#fff" opacity="0.9"/>
    <path d="M5 60 L10 25 L90 25 L95 60" fill="#FEF3C7" opacity="0.8"/>
    <rect x="15" y="60" width="70" height="50" fill="#065F46" opacity="0.7"/>
    <!-- bread -->
    <ellipse cx="35" cy="85" rx="10" ry="7" fill="#D97706"/>
    <ellipse cx="55" cy="82" rx="12" ry="8" fill="#B45309"/>
    <ellipse cx="72" cy="88" rx="9" ry="6" fill="#D97706"/>
  </g>
  <!-- bunting -->
  <g opacity="0.7">
    <path d="M0 70 Q200 50 400 70" stroke="#fff" stroke-width="2" fill="none"/>
    <polygon points="40,67 50,82 60,67" fill="#FBBF24"/>
    <polygon points="120,60 130,75 140,60" fill="#EC4899"/>
    <polygon points="200,53 210,68 220,53" fill="#3B82F6"/>
    <polygon points="280,60 290,75 300,60" fill="#EF4444"/>
    <polygon points="360,67 370,82 380,67" fill="#FBBF24"/>
  </g>
</svg>
