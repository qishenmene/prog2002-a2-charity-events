<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- light bulb -->
  <g transform="translate(200,80)">
    <path d="M-20 0 Q-20 -20 0 -20 Q20 -20 20 0 L20 15 Q20 25 10 30 L-10 30 Q-20 25 -20 15 Z" fill="#FBBF24" opacity="0.9"/>
    <rect x="-10" y="30" width="20" height="8" fill="#92400E"/>
    <rect x="-8" y="38" width="16" height="4" fill="#78350F"/>
    <!-- rays -->
    <g stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <line x1="-35" y1="0" x2="-25" y2="-5"/>
      <line x1="35" y1="0" x2="25" y2="-5"/>
      <line x1="0" y1="-35" x2="0" y2="-25"/>
      <line x1="-25" y1="-25" x2="-18" y2="-18"/>
      <line x1="25" y1="-25" x2="18" y2="-18"/>
    </g>
  </g>
  <!-- question marks -->
  <g fill="#FDE68A" opacity="0.6" font-family="Arial,sans-serif" font-weight="bold">
    <text x="80" y="120" font-size="40">?</text>
    <text x="300" y="100" font-size="50">?</text>
    <text x="60" y="200" font-size="30">?</text>
    <text x="330" y="220" font-size="35">?</text>
  </g>
  <!-- table with quiz sheets -->
  <rect x="80" y="200" width="240" height="80" rx="5" fill="#fff" opacity="0.15"/>
  <rect x="80" y="200" width="240" height="80" rx="5" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.4"/>
  <!-- quiz sheets -->
  <g fill="#fff" opacity="0.8">
    <rect x="120" y="210" width="60" height="40" rx="3" transform="rotate(-5 150 230)"/>
    <rect x="200" y="210" width="60" height="40" rx="3"/>
    <rect x="160" y="215" width="60" height="40" rx="3" transform="rotate(3 190 235)"/>
  </g>
  <g stroke="#0D9488" stroke-width="1.5" opacity="0.6">
    <line x1="130" y1="225" x2="165" y2="225"/>
    <line x1="130" y1="232" x2="155" y2="232"/>
    <line x1="210" y1="225" x2="245" y2="225"/>
    <line x1="210" y1="232" x2="235" y2="232"/>
  </g>
</svg>
