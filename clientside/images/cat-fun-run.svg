<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- coastal path -->
  <path d="M0 250 Q200 220 400 250 V300 H0 Z" fill="#FEF3C7" opacity="0.3"/>
  <!-- sun -->
  <circle cx="320" cy="70" r="35" fill="#FEF9C3" opacity="0.8"/>
  <!-- runner 1 -->
  <g fill="#fff" opacity="0.9">
    <circle cx="100" cy="130" r="12"/>
    <path d="M95 142 L85 175 L75 200" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M105 142 L120 165 L115 200" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M95 155 L70 145" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M108 150 L130 160" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
  <!-- runner 2 -->
  <g fill="#fff" opacity="0.75">
    <circle cx="200" cy="145" r="10"/>
    <path d="M196 155 L188 185 L180 210" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M204 155 L215 178 L210 210" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M197 165 L178 158" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M206 162 L222 170" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <!-- runner 3 -->
  <g fill="#fff" opacity="0.6">
    <circle cx="280" cy="155" r="9"/>
    <path d="M277 164 L270 190 L264 215" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M283 164 L292 184 L288 215" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M277 172 L262 166" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M284 170 L296 175" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- finish line banner -->
  <g transform="translate(330,180)">
    <rect x="0" y="0" width="50" height="60" fill="#fff" opacity="0.85" rx="3"/>
    <rect x="5" y="8" width="40" height="4" fill="#EF4444"/>
    <rect x="5" y="16" width="40" height="4" fill="#EF4444"/>
    <rect x="5" y="24" width="40" height="4" fill="#EF4444"/>
  </g>
</svg>
